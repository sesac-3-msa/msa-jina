# AWS Load Balancer Controller + Metrics Server 설치
- name: Install cluster add-ons
  hosts: local
  gather_facts: false

  tasks:
    - name: Add eks-charts Helm repo
      kubernetes.core.helm_repository:
        name: eks
        repo_url: https://aws.github.io/eks-charts

    - name: Add metrics-server Helm repo
      kubernetes.core.helm_repository:
        name: metrics-server
        repo_url: https://kubernetes-sigs.github.io/metrics-server/

    - name: Install AWS Load Balancer Controller
      kubernetes.core.helm:
        name: aws-load-balancer-controller
        chart_ref: eks/aws-load-balancer-controller
        release_namespace: kube-system
        update_repo_cache: true
        wait: true
        values:
          clusterName: "{{ cluster_name }}"
          # AL2023 노드는 IMDS hop limit=1 이라 파드에서 메타데이터 조회가 안 되므로 명시
          region: "{{ region }}"
          vpcId: "{{ vpc_id }}"
          serviceAccount:
            create: true
            name: aws-load-balancer-controller
            annotations:
              # 빠지면 컨트롤러는 Running인데 LB 생성만 조용히 실패한다
              eks.amazonaws.com/role-arn: "{{ lb_controller_role_arn }}"

    - name: Install Metrics Server
      kubernetes.core.helm:
        name: metrics-server
        chart_ref: metrics-server/metrics-server
        release_namespace: kube-system
        update_repo_cache: true
        wait: true

    - name: Verify LB controller service account annotation
      kubernetes.core.k8s_info:
        kind: ServiceAccount
        namespace: kube-system
        name: aws-load-balancer-controller
      register: sa

    - name: Assert IRSA annotation present
      ansible.builtin.assert:
        that:
          - sa.resources[0].metadata.annotations['eks.amazonaws.com/role-arn'] == lb_controller_role_arn
        fail_msg: "서비스어카운트에 IRSA 어노테이션이 없음"
