plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.practice'
version = '0.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    // Spring Boot 3.5.15 <-> Spring Cloud 2025.0.3 (Northfields) 호환 확인됨
    set('springCloudVersion', '2025.0.3')
}

dependencies {
    // Spring Cloud 2025.0.x부터 gateway 스타터 이름이 바뀜 (구: spring-cloud-starter-gateway)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

// plain jar 생성 방지 — Dockerfile의 COPY build/libs/*.jar 가 단일 파일이 되도록
jar {
    enabled = false
}
