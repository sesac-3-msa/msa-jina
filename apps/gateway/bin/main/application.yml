spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: member
              uri: ${MEMBER_SERVICE_URL}
              predicates:
                - Path=/api/members/**,/api/auth/**
            - id: order
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/api/orders/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
